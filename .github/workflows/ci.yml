name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  rust-checks:
    name: Rust Code Quality & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked -- -D warnings

      - name: Run Cargo Tests
        run: cargo test --locked

  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    needs: rust-checks
    runs-on: ${{ matrix.os }}
    env:
      RPLY_STRICT_TESTS: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        # Older Python installers require Intel; also exercise native Apple Silicon.
        include:
          - {os: macos-latest, python-version: "3.11"}
          - {os: macos-latest, python-version: "3.12"}
          - {os: macos-latest, python-version: "3.13"}
          - {os: macos-latest, python-version: "3.14"}

    steps:
      - uses: actions/checkout@v4

      - name: Check out pinned PLY reference
        uses: actions/checkout@v4
        with:
          repository: dabeaz/ply
          ref: 9d7c40099e23ff78f9d86ef69a26c1e8a83e706a
          path: upstream/ply
          persist-credentials: false

      - name: Check out pinned SLY reference
        uses: actions/checkout@v4
        with:
          repository: dabeaz/sly
          ref: 09c2ba30df9143298ae5eef79d0baf23755d4cd9
          path: upstream/sly
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Create and configure virtual environment
        shell: bash
        run: |
          python -m venv .venv
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "$GITHUB_WORKSPACE/.venv/Scripts" >> "$GITHUB_PATH"
          else
            echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          fi
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> "$GITHUB_ENV"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install maturin pytest

      - name: Build and install rply (dev mode)
        run: maturin develop --release --locked

      - name: Run pytest (Rust backend)
        env:
          RPLY_BACKEND: rust
        run: python -m pytest --junitxml=reports/pytest-rust.xml

      - name: Upload test reports, including skip reasons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ matrix.os }}-${{ matrix.python-version }}
          path: reports/*.xml
          if-no-files-found: warn

      - name: Verify benchmarks workload consistency
        run: python benchmarks/suite.py --engine rust ply sly --check

  wheel-contracts:
    name: Installed release wheel contracts (Python 3.14)
    needs: rust-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: dtolnay/rust-toolchain@stable

      - name: Build release wheel
        run: |
          python -m pip install maturin
          python -m maturin build --release --locked --interpreter python --out dist

      - name: Install wheel in a fresh virtual environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/rply-wheel-venv"
          "$RUNNER_TEMP/rply-wheel-venv/bin/python" -m pip install --no-deps dist/*.whl

      - name: Verify installed APIs outside the source checkout
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/rply-wheel-verification"
          cp .github/scripts/verify_wheel.py "$RUNNER_TEMP/rply-wheel-verification/verify_wheel.py"
          cd "$RUNNER_TEMP/rply-wheel-verification"
          env -u PYTHONPATH RPLY_CHECKOUT="$GITHUB_WORKSPACE" \
            "$RUNNER_TEMP/rply-wheel-venv/bin/python" -I verify_wheel.py --all
