[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "ply-rs"
version = "0.1.0"
description = "Modern successor to PLY and SLY with a native Rust engine and Python APIs"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "Flowsink" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Interpreters",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Flowsink666/rply"
Repository = "https://github.com/Flowsink666/rply"
Issues = "https://github.com/Flowsink666/rply/issues"

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.maturin]
python-source = "src"
module-name = "ply_rs._core_rs"
include = [
    { path = "benchmarks/**/*", format = "sdist" },
    { path = "tests/**/*", format = "sdist" },
    { path = "examples/**/*", format = "sdist" },
    { path = "docs/**/*", format = "sdist" },
    { path = ".github/scripts/verify_wheel.py", format = "sdist" },
]
exclude = ["**/__pycache__/**", "**/*.pyc", "upstream/ply/**", "upstream/sly/**"]

[tool.pytest.ini_options]
testpaths = ["tests/core", "tests/modern", "tests/compat", "tests/differential"]
pythonpath = ["src"]
markers = ["differential: compares compatibility APIs against optional upstream clones"]
addopts = "--strict-markers"
